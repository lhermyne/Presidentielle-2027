name: Vérifications
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: npm test
      - run: npm run forecast
      - run: npm run build
